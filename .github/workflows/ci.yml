# Integración continua: tipos, pruebas, build endurecido y verificación del resultado.
# Guarda el manifiesto de integridad de cada commit de main. Ver docs/SEGURIDAD.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Permisos mínimos: este flujo solo lee el repositorio.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tipos, pruebas, build y verificación
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # --ignore-scripts: ningún script de instalación de una dependencia se ejecuta en el CI.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test

      - name: Construir
        env:
          # Deben coincidir con las variables del proyecto en Vercel, o el manifiesto no será comparable.
          SITE_URL: ${{ vars.SITE_URL }}
          CSP_CONNECT_SRC: ${{ vars.CSP_CONNECT_SRC }}
          # Vercel fija el identificador de build al commit; acá se hace igual (ver next.config.ts).
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ -n "$SITE_URL" ]; then export NEXT_PUBLIC_SITE_URL="$SITE_URL"; fi
          npm run build

      - run: npm run verify

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integrity-manifest-${{ github.sha }}
          path: .integrity/manifest.json
          if-no-files-found: error
          retention-days: 90

  audit:
    name: Vulnerabilidades en dependencias de producción
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm audit --omit=dev --audit-level=high
